name: Build Paymenter image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag suffix (optional)'
        required: false
        default: 'manual'
  push:
    branches: [main]
    paths:
      - 'paymenter/**'
      - '.github/workflows/build-paymenter.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./paymenter
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:paymenter-${{ github.sha }}
            ${{ env.IMAGE }}:paymenter-${{ inputs.tag || 'latest' }}
